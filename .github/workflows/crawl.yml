name: Flight price monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. This is approximately 01:17, 07:17,
    # 13:17 and 19:17 in Vietnam (UTC+7).
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare user configuration
        env:
          USERS_JSON_B64: ${{ secrets.USERS_JSON_B64 }}
        run: |
          if [ -n "$USERS_JSON_B64" ]; then
            printf '%s' "$USERS_JSON_B64" | base64 --decode > config/users.json
          elif [ ! -f config/users.json ]; then
            cp config/users.example.json config/users.json
          fi

      - name: Crawl, compare and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_KHOAFUNG: ${{ secrets.TELEGRAM_CHAT_ID_KHOAFUNG }}
          TELEGRAM_CHAT_ID_LAM: ${{ secrets.TELEGRAM_CHAT_ID_LAM }}
          # Keep legacy names available for older users.json files.
          TELEGRAM_CHAT_ID_OWNER: ${{ secrets.TELEGRAM_CHAT_ID_OWNER }}
          TELEGRAM_CHAT_ID_FRIEND_1: ${{ secrets.TELEGRAM_CHAT_ID_FRIEND_1 }}
          PYTHONUNBUFFERED: "1"
        run: python run_once.py --config config/users.json --state state/latest.json

      - name: Commit updated state
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest.json
          git diff --cached --quiet || git commit -m "Update flight price state"
          git push
